<!-- start custom head snippets -->

<!-- Apply a stored light/dark choice before first paint, so there is no flash
     of the wrong theme. Must stay ahead of the body; the toggle that writes
     this value lives in _includes/masthead.html. -->
<script>
  (function () {
    try {
      var t = window.localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) { /* private mode / storage disabled */ }
  })();
</script>

<!-- the toggle is inert without JS, so don't offer it -->
<noscript><style>.theme-toggle { display: none; }</style></noscript>
