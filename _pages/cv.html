{%- comment -%}
  The fitvidsignore class is required. assets/js/main.min.js runs
  $("#main").fitVids(), whose selector list includes every <object> and <embed>.
  For a PDF it computes an aspect ratio of NaN, sets padding-top: NaN% on an
  injected wrapper and forces the object to height: 100%, collapsing the embed
  to zero height. FitVids skips anything inside a .fitvidsignore ancestor.
{%- endcomment -%}
<div class="cv__embed fitvidsignore">
  <object class="fitvidsignore" data="{{ base_path }}/files/Tianyu_Kong_CV.pdf" type="application/pdf">
    <p class="cv__fallback">
      Your browser can&rsquo;t display PDFs inline.
      <a href="{{ base_path }}/files/Tianyu_Kong_CV.pdf">Download the CV instead</a>.
    </p>
  </object>
</div>
